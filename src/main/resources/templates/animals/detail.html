<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Detalles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container">
        <h1>Detalle del animal</h1>
        <ul>
            <li><p>ID: <span th:text="${animal.id}"></span></p></li>
            <li><p>Nombre: <span th:text="${animal.nombre}"></span></p></li>
            <li><p>Vida Media: <span th:text="${animal.vidaMedia}"></span></p></li>
            <li><p>Extinto: <span th:text="${animal.extinto ? 'Sí' : 'No'}"></span></p></li>
        </ul>
        <a th:href="@{/animals}" class="btn btn-primary mt-5">Volver al listado</a>
    </div>

</body>
</html>
