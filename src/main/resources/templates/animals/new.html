
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo animal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
          crossorigin="anonymous">

    <script type="module"
            src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
            crossorigin="anonymous"></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">
    <h1>Registrar nuevo animal</h1>

    <form th:action="@{/animals}"
          th:object="${animal}"
          method="post">

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text"
                   id="nombre"
                   th:field="*{nombre}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label for="vidaMedia" class="form-label">
                Vida media
            </label>
            <input type="number"
                   id="vidaMedia"
                   th:field="*{vidaMedia}"
                   class="form-control"
                   min="1"
                   required>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox"
                   id="extinto"
                   th:field="*{extinto}"
                   class="form-check-input">
            <label for="extinto" class="form-check-label">
                ¿Está extinto?
            </label>
        </div>

        <button type="submit" class="btn btn-primary">
            Guardar animal
        </button>

        <a th:href="@{/animals}" class="btn btn-secondary">
            Volver al listado
        </a>
    </form>
</div>

</body>
</html>
