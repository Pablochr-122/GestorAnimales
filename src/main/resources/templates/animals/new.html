
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${editMode} ? 'Editar animal' : 'Nuevo animal'">
        Nuevo animal
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
          crossorigin="anonymous">

    <script type="module"
            src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
            crossorigin="anonymous"></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-4">

    <h1 th:text="${editMode} ? 'Editar animal' : 'Registrar nuevo animal'">
        Registrar nuevo animal
    </h1>

    <form th:action="${editMode}
              ? @{/animals/{id}/edit(id=${animal.id})}
              : @{/animals}"
          th:object="${animal}"
          method="post">

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>

            <input type="text"
                   id="nombre"
                   th:field="*{nombre}"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''">

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('nombre')}"
                 th:errors="*{nombre}">
                Error en el nombre
            </div>
        </div>

        <div class="mb-3">
            <label for="vidaMedia" class="form-label">
                Vida media
            </label>

            <input type="number"
                   id="vidaMedia"
                   th:field="*{vidaMedia}"
                   min="0"
                   max="600"
                   step="1"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('vidaMedia')} ? 'is-invalid' : ''">

            <div class="invalid-feedback"
                 th:if="${#fields.hasErrors('vidaMedia')}"
                 th:errors="*{vidaMedia}">
                Error en la vida media
            </div>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox"
                   id="extinto"
                   th:field="*{extinto}"
                   class="form-check-input">

            <label for="extinto" class="form-check-label">
                ¿Está extinto?
            </label>
        </div>

        <button type="submit"
                class="btn btn-primary"
                th:text="${editMode} ? 'Guardar cambios' : 'Guardar animal'">
            Guardar animal
        </button>

        <a th:href="@{/animals}" class="btn btn-secondary">
            Volver al listado
        </a>

    </form>

</div>

</body>
</html>
