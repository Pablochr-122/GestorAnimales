<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gestion Animales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container">
    <h1>Listado de Animales</h1>
    <a th:href="@{/animals/new}" class="btn btn-primary mb-3">
        Añadir animal
    </a>
    <table class="table w-auto">
        <thead>
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Vida media</th>
            <th>Extinto</th>
            <th>Detalles</th>
            <th>Editar</th>
        </tr>
        </thead>
        <tbody>
            <tr th:each="animal : ${animals}">
                <td th:text="${animal.id}"></td>
                <td th:text="${animal.nombre}"></td>
                <td th:text="${animal.vidaMedia}"></td>
                <td th:text="${animal.extinto ? 'Sí' : 'No'}"></td>
                <td><a th:href="@{/animals/{id}(id=${animal.id})}"><button type="button" class="btn-outline theme-success">Detalles</button></a></td>
                <td><a th:href="@{/animals/{id}/edit(id=${animal.id})}"><button type="button" class="btn-outline theme-success">Editar</button></a></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
